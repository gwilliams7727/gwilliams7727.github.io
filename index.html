<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }

        main {
            padding: 40px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This is my basic webpage.</p>
    </header>

    <main>
        <h2>About Me</h2>
        <p>Hello! This is a simple website made with HTML and CSS.</p>

        <button onclick="sayHello()">Click Me</button>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function sayHello() {
            alert("Hello!");
        }
    </script>

</body>
</html>
